<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heladería Aserrí</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <style>
        /* ── RESET & BASE ─────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --cream: #fdf6ec;
            --warm: #f5e6cc;
            --copper: #c8814a;
            --copper-d: #a3622e;
            --brown: #3d2008;
            --text: #2a1505;
            --muted: #8a6848;
            --card-bg: #fffaf4;
            --shadow: 0 4px 24px rgba(61, 32, 8, .10);
            --radius: 18px;
            --transition: .3s cubic-bezier(.4, 0, .2, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── NAV ──────────────────────────────────────── */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2.5rem;
            height: 64px;
            background: rgba(253, 246, 236, .88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(200, 129, 74, .18);
            transition: box-shadow var(--transition);
        }

        nav.scrolled {
            box-shadow: 0 2px 20px rgba(61, 32, 8, .10);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--brown);
            letter-spacing: -.01em;
            display: flex;
            align-items: center;
            gap: .45rem;
        }

        .links {
            display: flex;
            gap: .25rem;
        }

        .links a {
            text-decoration: none;
            color: var(--muted);
            font-size: .875rem;
            font-weight: 500;
            padding: .45rem 1rem;
            border-radius: 8px;
            transition: background var(--transition), color var(--transition);
            letter-spacing: .01em;
        }

        .links a:hover,
        .links a.active {
            background: var(--warm);
            color: var(--copper-d);
        }

        /* ── HERO ─────────────────────────────────────── */
        .hero {
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(ellipse 80% 60% at 70% 50%, rgba(200, 129, 74, .15) 0%, transparent 70%),
                radial-gradient(ellipse 50% 80% at 10% 90%, rgba(200, 129, 74, .10) 0%, transparent 60%),
                var(--cream);
            padding: 5rem 2.5rem 4rem;
            display: flex;
            align-items: center;
            min-height: 440px;
        }

        /* floating blobs */
        .hero::before,
        .hero::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: .35;
            pointer-events: none;
        }

        .hero::before {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #e8b97a 0%, transparent 70%);
            top: -120px;
            right: -80px;
            animation: floatBlob 8s ease-in-out infinite alternate;
        }

        .hero::after {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #c8814a 0%, transparent 70%);
            bottom: -60px;
            left: 10%;
            animation: floatBlob 10s ease-in-out 2s infinite alternate;
        }

        @keyframes floatBlob {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(20px, 15px) scale(1.08);
            }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 640px;
            animation: fadeUp .7s ease both;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            background: var(--warm);
            border: 1px solid rgba(200, 129, 74, .3);
            border-radius: 100px;
            padding: .3rem .9rem;
            font-size: .78rem;
            font-weight: 500;
            color: var(--copper-d);
            margin-bottom: 1.2rem;
            letter-spacing: .03em;
            text-transform: uppercase;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 4.5vw, 3.2rem);
            font-weight: 700;
            line-height: 1.15;
            color: var(--brown);
            margin-bottom: 1rem;
        }

        .hero h1 em {
            font-style: italic;
            color: var(--copper);
        }

        .hero p {
            font-size: 1.05rem;
            color: var(--muted);
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 2rem;
            max-width: 460px;
        }

        /* Search */
        .search-wrapper {
            position: relative;
            max-width: 420px;
        }

        .search-wrapper svg {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
            width: 18px;
            height: 18px;
        }

        #buscar {
            width: 100%;
            padding: .85rem 1.2rem .85rem 2.8rem;
            border: 1.5px solid rgba(200, 129, 74, .25);
            border-radius: 100px;
            background: rgba(255, 255, 255, .85);
            font-family: 'DM Sans', sans-serif;
            font-size: .95rem;
            color: var(--text);
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
            backdrop-filter: blur(6px);
        }

        #buscar:focus {
            border-color: var(--copper);
            box-shadow: 0 0 0 3px rgba(200, 129, 74, .15);
        }

        #buscar::placeholder {
            color: var(--muted);
            opacity: .7;
        }

        /* ── MAIN LAYOUT ──────────────────────────────── */
        .contenedor-principal {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 2rem;
            padding: 2.5rem 2.5rem 3rem;
            align-items: start;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        /* ── SECTION HEADER ───────────────────────────── */
        .titulo-section {
            display: flex;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .titulo-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--brown);
        }

        .titulo-section .count {
            font-size: .8rem;
            color: var(--muted);
            font-weight: 400;
        }

        /* ── PRODUCTOS GRID ───────────────────────────── */
        .productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.25rem;
        }

        /* Individual card — styles for JS-generated cards */
        .producto-card {
            background: var(--card-bg);
            border: 1px solid rgba(200, 129, 74, .12);
            border-radius: var(--radius);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: .6rem;
            transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
            animation: fadeUp .5s ease both;
            cursor: default;
        }

        .producto-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: rgba(200, 129, 74, .3);
        }

        .producto-card .emoji {
            font-size: 2.4rem;
            line-height: 1;
        }

        .producto-card .nombre {
            font-weight: 500;
            font-size: .95rem;
            color: var(--brown);
        }

        .producto-card .precio {
            font-size: .85rem;
            color: var(--copper);
            font-weight: 500;
        }

        .producto-card .btn-agregar {
            margin-top: auto;
            background: var(--brown);
            color: var(--cream);
            border: none;
            border-radius: 10px;
            padding: .5rem .75rem;
            font-family: 'DM Sans', sans-serif;
            font-size: .82rem;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition), transform var(--transition);
        }

        .producto-card .btn-agregar:hover {
            background: var(--copper-d);
        }

        .producto-card .btn-agregar:active {
            transform: scale(.96);
        }

        /* ── CARRITO ──────────────────────────────────── */
        .carrito {
            position: sticky;
            top: 80px;
            background: var(--card-bg);
            border: 1px solid rgba(200, 129, 74, .15);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .carrito-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.5rem 1rem;
            border-bottom: 1px solid rgba(200, 129, 74, .12);
        }

        .carrito-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--brown);
        }

        #contador {
            background: var(--copper);
            color: #fff;
            font-size: .75rem;
            font-weight: 600;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            transition: transform .2s;
        }

        #contador.pop {
            animation: pop .25s ease;
        }

        @keyframes pop {
            50% {
                transform: scale(1.4);
            }
        }

        #carrito {
            list-style: none;
            padding: 1rem 1.5rem;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: .6rem;
            scrollbar-width: thin;
            scrollbar-color: var(--warm) transparent;
        }

        #carrito:empty::after {
            content: 'Tu carrito está vacío';
            color: var(--muted);
            font-size: .85rem;
            opacity: .7;
            text-align: center;
            padding: 1.5rem 0;
            display: block;
        }

        #carrito li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .5rem;
            font-size: .875rem;
            color: var(--text);
            padding: .5rem .6rem;
            border-radius: 10px;
            background: var(--warm);
            animation: slideIn .2s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-8px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        #carrito li .item-price {
            color: var(--copper);
            font-weight: 500;
            white-space: nowrap;
        }

        #carrito li .btn-quitar {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1;
            padding: 0 .2rem;
            transition: color var(--transition);
        }

        #carrito li .btn-quitar:hover {
            color: #c0392b;
        }

        .carrito-footer {
            padding: 1rem 1.5rem 1.25rem;
            border-top: 1px solid rgba(200, 129, 74, .12);
            display: flex;
            flex-direction: column;
            gap: .9rem;
        }

        #total {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: var(--brown);
        }

        .acciones {
            display: flex;
            gap: .75rem;
        }

        .btn-principal,
        .btn-secundario {
            flex: 1;
            padding: .65rem;
            border: none;
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: .875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition), transform var(--transition);
        }

        .btn-principal {
            background: var(--brown);
            color: var(--cream);
        }

        .btn-principal:hover {
            background: var(--copper-d);
        }

        .btn-principal:active {
            transform: scale(.97);
        }

        .btn-secundario {
            background: var(--warm);
            color: var(--muted);
        }

        .btn-secundario:hover {
            background: #edd9b8;
        }

        .btn-secundario:active {
            transform: scale(.97);
        }

        /* ── TOAST ────────────────────────────────────── */
        #toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(60px);
            background: var(--brown);
            color: var(--cream);
            padding: .65rem 1.4rem;
            border-radius: 100px;
            font-size: .875rem;
            font-weight: 500;
            opacity: 0;
            transition: transform .35s ease, opacity .35s ease;
            pointer-events: none;
            z-index: 999;
            white-space: nowrap;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ── FOOTER ───────────────────────────────────── */
        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: .8rem;
            color: var(--muted);
            border-top: 1px solid rgba(200, 129, 74, .12);
        }

        footer strong {
            color: var(--copper-d);
            font-weight: 500;
        }

        /* ── ANIMATIONS ───────────────────────────────── */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── RESPONSIVE ───────────────────────────────── */
        @media (max-width: 900px) {
            .contenedor-principal {
                grid-template-columns: 1fr;
                padding: 1.5rem;
            }

            .carrito {
                position: static;
            }
        }

        @media (max-width: 560px) {
            nav {
                padding: 0 1.2rem;
            }

            .hero {
                padding: 3.5rem 1.2rem 3rem;
                min-height: unset;
            }
        }
    </style>
</head>

<body>

    <!-- NAV -->
    <nav id="navbar">
        <div class="logo"> Heladería Aserrí</div>
        <div class="links">
            <a href="/" class="active">Inicio</a>
            <a href="/admin">Admin</a>
        </div>
    </nav>

    <!-- HERO -->
    <header class="hero">
        <div class="hero-content">



            <h1>Los mejores helados<br>de <em>Costa Rica</em> </h1>

            <p>Sabores artesanales, toppings premium y pedidos rápidos desde Aserrí.</p>

            <div class="search-wrapper">
                <!-- search icon -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input id="buscar" placeholder="Buscar helado…" autocomplete="off">
            </div>

        </div>
    </header>

    <!-- CONTENIDO -->
    <main class="contenedor-principal">

        <!-- PRODUCTOS -->
        <section class="productos-section">
            <div class="titulo-section">
                <h2>Nuestros Helados</h2>
                <span class="count" id="count-label"></span>
            </div>
            <div id="productos" class="productos"></div>
        </section>

        <!-- CARRITO -->
        <aside class="carrito">
            <div class="carrito-header">
                <h2> Carrito</h2>
                <span id="contador">0</span>
            </div>

            <ul id="carrito"></ul>

            <div class="carrito-footer">
                <h3 id="total">Total: ₡0</h3>
                <div class="acciones">
                    <button id="vaciar" class="btn-secundario">Vaciar</button>
                    <button id="pedido" class="btn-principal">Enviar Pedido</button>
                </div>
            </div>
        </aside>

    </main>

    <!-- TOAST -->
    <div id="toast"></div>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 <strong>Heladería Aserrí</strong> &nbsp;•&nbsp; Proyecto Full Stack Flask + MongoDB</p>
    </footer>

    <!-- JS original del proyecto -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

    <!-- JS de interactividad UI (no toca la lógica de negocio) -->
    <script>
        /* ── Navbar shadow on scroll ── */
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            navbar.classList.toggle('scrolled', window.scrollY > 10);
        }, { passive: true });

        /* ── Toast helper (exportado para que script.js lo use si quiere) ── */
        window.showToast = function (msg, duration = 2400) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), duration);
        };

        /* ── Contador pop animation ── */
        const contadorEl = document.getElementById('contador');
        const obs = new MutationObserver(() => {
            contadorEl.classList.remove('pop');
            void contadorEl.offsetWidth; // reflow
            contadorEl.classList.add('pop');
        });
        obs.observe(contadorEl, { childList: true, characterData: true, subtree: true });

        /* ── Buscador: staggered reveal on cards ── */
        const buscarEl = document.getElementById('buscar');
        buscarEl?.addEventListener('input', () => {
            // Applies stagger to cards after script.js filters them
            requestAnimationFrame(() => {
                document.querySelectorAll('.producto-card').forEach((c, i) => {
                    c.style.animationDelay = `${i * 45}ms`;
                });
            });
        });

        /* ── Stagger initial cards when DOM updates ── */
        const productosEl = document.getElementById('productos');
        if (productosEl) {
            const cardObs = new MutationObserver(() => {
                document.querySelectorAll('.producto-card').forEach((c, i) => {
                    c.style.animationDelay = `${i * 60}ms`;
                });
                const n = document.querySelectorAll('.producto-card').length;
                const lbl = document.getElementById('count-label');
                if (lbl) lbl.textContent = n ? `${n} sabores` : '';
            });
            cardObs.observe(productosEl, { childList: true });
        }
    </script>

</body>

</html>
